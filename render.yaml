services:
  # ── Rails API ────────────────────────────────────────────────────────────────
  - type: web
    name: zone-api
    runtime: ruby
    rootDir: backend
    buildCommand: bundle install && bundle exec rails db:migrate
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: zone-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zone-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        generateValue: true
      - key: ATTR_ENCRYPTED_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        generateValue: true

  # ── Sidekiq Worker ───────────────────────────────────────────────────────────
  - type: worker
    name: zone-worker
    runtime: ruby
    rootDir: backend
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zone-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: zone-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        fromService:
          name: zone-api
          type: web
          envVarKey: SECRET_KEY_BASE
      - key: DEVISE_JWT_SECRET_KEY
        fromService:
          name: zone-api
          type: web
          envVarKey: DEVISE_JWT_SECRET_KEY
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: ATTR_ENCRYPTED_KEY
        sync: false
      - key: INTERNAL_API_TOKEN
        fromService:
          name: zone-api
          type: web
          envVarKey: INTERNAL_API_TOKEN

  # ── React Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: zone-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GRAPHQL_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: zone-db
    databaseName: zone_production
    user: zone

  - name: zone-redis
    type: redis
    plan: free
    maxmemoryPolicy: noeviction
